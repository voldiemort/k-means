[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kmeans-study"
version = "0.1.0"
description = "Reproducible one-dimensional experiments on K-means initialisation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.9"]

[project.scripts]
kmeans-study = "kmeans_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
